# Despliegue: Postgres + RcvKiubo. `cp .env.example .env`, completar los secretos, y
#   docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: rcv_kiubo
    volumes:
      - rcv_kiubo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcv} -d rcv_kiubo"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rcv}:${POSTGRES_PASSWORD}@db:5432/rcv_kiubo
      NODE_ENV: production
    ports:
      # Sólo local: se publica detrás de un proxy (nginx / Cloudflare Tunnel) con TLS.
      - "127.0.0.1:${PUERTO_PUBLICADO:-4100}:4100"

volumes:
  rcv_kiubo_db:
